<body>

<script src="state.js"></script>
<script>
(function(){
var P=IGL.DEMO.price, D=IGL.DEMO, m=document.getElementById("m");
var CARD='<svg viewBox="0 0 46 32" aria-hidden="true"><rect x="1" y="1" width="44" height="30" rx="6" fill="#DFEEE9" stroke="#194F52" stroke-width="1.5"/><rect x="1" y="8" width="44" height="6" fill="#194F52"/><rect x="7" y="21" width="16" height="3" rx="1.5" fill="#194F52"/></svg>';
var FEAT=[["ic_game","Все интерактивные занятия и игры"],["ic_calendar","Пополнение новыми занятиями и играми"],["ic_smile_calm","Без рекламы и ссылок на соцсети автора"],["ic_chat","Поддержка по вопросам о занятиях и играх"],["ic_heart","Пожелания по новым занятиям и играм рассматриваем"]];
var KEY='<div class="key"><b>Демо-доступ для проверки</b><br>Почта: <b>'+D.email+'</b><br>Код из письма: <b>'+D.code+'</b><br>Письма в демонстрации не отправляются.</div>';
var views={
sub:function(){return '<div class="two"><div><h1>Подписка на интерактивные занятия и игры</h1><p class="lead2">Развитие речи: для родителей и специалистов.</p><div class="inc"><div class="inc-h">Что вы получаете</div><ul class="feat">'+
 FEAT.map(function(f){return '<li><img src="../../assets/'+f[0]+'.png" alt=""><span>'+f[1]+'</span></li>';}).join("")+
 '</ul><p class="also">Специалисты могут заниматься по подписке со своими клиентами. До 3 устройств.</p></div></div>'+
 '<div class="box pay"><div class="pay-h">Ежемесячная подписка</div><div class="sb-price">'+P+' ₽ <small>в месяц</small></div>'+
 '<p class="devnote"><b>Для компьютера или планшета.</b> На телефоне картинки мелкие, и заниматься неудобно.</p>'+
 '<div class="consent"><label class="agree"><input type="checkbox" id="ag"><i></i><span>Согласен(на) на автоматическое списание '+P+' ₽ раз в месяц. Отключить можно в любой момент в личном кабинете.</span></label></div>'+
 '<p class="fine">Для следующих списаний карту сохраняет ЮKassa. Номер и другие данные карты мы не получаем и не храним. После отключения доступ действует до конца оплаченного срока. Оформляя подписку, вы принимаете <a href="../../oferta/">публичную оферту</a> и <a href="usloviya.html">условия подписки</a>.</p>'+
 '<button class="b" id="start" disabled>Оформить подписку</button><p class="fine center" style="margin:10px 0 0">Сначала подтвердим почту кодом, затем откроется страница оплаты ЮKassa.</p>'+
 '<div class="have">Уже подписаны? <a href="?s=email">Войти</a></div></div></div>';},
email:function(){return '<div class="narrow">'+KEY+'<div class="box"><h1>Вход по почте</h1><p>Пришлём письмо с кодом из 6 цифр. Пароль придумывать не нужно.</p><form id="f"><label class="lbl" for="em">Ваша почта</label><input class="inp" id="em" type="email" autocomplete="off" value="'+D.email+'"><p class="err" id="er"></p><button class="b dk">Получить код</button></form><p class="small" style="margin-top:14px">Как мы обрабатываем данные: <a href="../../privacy/">политика конфиденциальности</a>.</p></div></div>';},
code:function(){return '<div class="narrow">'+KEY+'<div class="box"><h1>Введите код</h1><p>Код для <b>'+D.email+'</b>.</p><form id="f"><input class="inp code-inp" id="cd" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="Код из 6 цифр"><p class="err" id="er"></p><button class="b dk">Войти</button></form><p class="small center" style="margin-top:14px">Код действует 10 минут. <a href="?s=email">Изменить почту</a></p><p class="small center" style="margin:0">Вход на этом устройстве запомним на 90 дней.</p></div></div>';},
pay:function(){return '<div class="narrow"><div class="box"><h1>Шаг оплаты (демонстрация)</h1><p>При настоящей подписке здесь открывается защищённая страница ЮKassa. В демонстрации деньги не списываются и данные карты не вводятся.</p><div class="cardbox" style="margin:0 0 14px"><div class="cardline" style="margin:0">'+CARD+'<div><b>Тестовая карта •••• 4444</b><span>виртуальная, для проверки</span></div></div></div><div class="sb-rows" style="margin:0 0 16px"><div><span>Сумма</span><b>'+P+' ₽</b></div><div><span>Далее</span><b>каждый месяц</b></div></div><button class="b" id="dopay">Подтвердить тестовую оплату</button></div></div>';},
my:function(dlg){var s=IGL.get(), off=!s.card, u=s.until||IGL.until();
 var h='<div class="cab"><h1>Моя подписка</h1><p class="small" style="font-size:15px">'+D.email+'</p><div class="box">'+
 (off?'<span class="badge warn">Карта отвязана</span><p style="margin:16px 0 0;font-size:18px"><b>Списаний больше не будет.</b> Занятия и игры открыты до '+u+' года.</p>':'<span class="badge">Подписка активна</span>')+
 '<div class="sb-rows">'+(off?'<div><span>Доступ</span><b>до '+u+'</b></div><div><span>Следующее списание</span><b>нет</b></div>':'<div><span>Стоимость</span><b>'+P+' ₽ в месяц</b></div><div><span>Следующее списание</span><b>'+u+'</b></div><div><span>Оплачено до</span><b>'+u+'</b></div>')+'<div><span>Устройства</span><b>1 из 3</b></div></div>'+
 (off?'<div class="cardbox"><p style="margin:0 0 14px">Привязанной карты нет. Чтобы продолжить после '+u+', оформите подписку снова.</p><a class="b" href="?s=sub">Подключить подписку снова</a></div>':
 '<div class="cardbox"><div class="cardline">'+CARD+'<div><b>Банковская карта •••• 4444</b><span>для автоматической оплаты</span></div></div><button class="b ln" id="unbind">Отвязать карту</button><p class="small" style="margin:10px 0 0">Отвязка отменяет подписку: автосписания прекратятся, доступ сохранится до конца оплаченного срока.</p><p class="small" style="margin:8px 0 0">Карта хранится на стороне ЮKassa. У нас нет её номера: только служебный идентификатор для списаний и последние 4 цифры.</p></div>')+
 '</div><div class="stack" style="margin-top:18px"><a class="b" href="zanyatiya.html">Перейти к занятиям и играм</a></div><p class="center" style="margin-top:16px"><a href="mailto:igrovoylogoped@gmail.com">Написать в поддержку</a> · <button class="link" id="out">Выйти</button></p></div>';
 if(dlg) h+='<div class="ov"><div class="dlg" role="dialog" aria-modal="true"><h2>Отвязать карту?</h2><p>Автоматические списания прекратятся, идентификатор привязки карты мы удалим у себя.</p><p>Занятия и игры останутся открытыми до <b>'+u+' года</b>.</p><div class="stack" style="margin-top:18px"><button class="b" id="yes">Да, отвязать карту</button><button class="b ln" id="no">Оставить карту</button></div></div></div>';
 return h;}
};
function $(id){return document.getElementById(id);}
function on(id,ev,fn){var e=$(id); if(e) e.addEventListener(ev,fn);}
function go(n){history.pushState(null,"","?s="+n); render();}
function render(){
 var n=new URLSearchParams(location.search).get("s")||"sub", s=IGL.get();
 if(!views[n]&&n!=="confirm"&&n!=="off") n="sub";
 var cab=(n==="my"||n==="confirm"||n==="off");
 if(cab&&!(s.logged&&s.paid)) n=s.logged?"sub":"email", cab=false;
 m.innerHTML=cab?views.my(n==="confirm"):views[n]();
 $("seller").style.display=(n==="sub"||n==="pay")?"":"none";
 var hl=$("hlink"); hl.textContent=s.logged&&s.paid?"Моя подписка":"Войти"; hl.href=s.logged&&s.paid?"?s=my":"?s=email";
 window.scrollTo(0,0);
 on("ag","change",function(){$("start").disabled=!this.checked;});
 on("start","click",function(){ var v=IGL.get(); v.buying=true; IGL.set(v); go(v.logged?"pay":"email"); });
 if(n==="email") on("f","submit",function(e){e.preventDefault(); if($("em").value.trim().toLowerCase()!==D.email){$("er").textContent="В демонстрации работает только демо-почта "+D.email;return;} go("code");});
 if(n==="code") on("f","submit",function(e){e.preventDefault(); if($("cd").value.trim()!==D.code){$("er").textContent="Неверный код. Демо-код: "+D.code;return;}
   var v=IGL.get(); v.logged=true;
   if(v.buying){IGL.set(v); go("pay"); return;}
   /* вход демо-подписчика: подписка уже оплачена, виртуальная карта снова привязана */
   v.paid=true; v.card=true; v.until=IGL.until(); IGL.set(v); go("my");});
 on("dopay","click",function(){ IGL.set({logged:true,paid:true,card:true,until:IGL.until()}); go("my"); });
 on("unbind","click",function(){go("confirm");});
 on("no","click",function(){go("my");});
 on("yes","click",function(){var v=IGL.get(); v.card=false; IGL.set(v); go("off");});
 on("out","click",function(){IGL.set({}); go("sub");});
}
window.addEventListener("popstate",render);
render();
})();
