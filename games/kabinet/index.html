<style>
body{background:#FAF5EB;min-height:100vh;display:flex;flex-direction:column}
.sh{background:#FAF5EB;border-bottom:1px solid rgba(25,52,73,.1)}
.sh .in{max-width:1040px;margin:0 auto;padding:0 20px;height:66px;display:flex;align-items:center;gap:16px}
.sh b{font:800 19px Onest,Inter,sans-serif;color:#194F52;margin-right:auto;white-space:nowrap}
.sh a{font:600 15px Inter,sans-serif;color:#194F52;text-decoration:none;white-space:nowrap}
main.s{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:36px 20px 48px;box-sizing:border-box}
.s h1{font:800 clamp(28px,4vw,40px)/1.15 Onest,Inter,sans-serif;color:#193449;margin:0 0 12px}
.s p{margin:0 0 12px}
.lead2{font-size:18px;color:#4b5f6c;max-width:560px}
.two{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:start}
.box{background:#fff;border-radius:24px;box-shadow:0 10px 34px rgba(25,52,73,.10);padding:28px}
.sb-list{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:12px}
.sb-list li{display:flex;gap:12px;align-items:flex-start;font-size:17px;line-height:1.45;background:#fff;border-radius:16px;padding:14px 16px}
.sb-list li:before{content:"\2713";flex:none;width:26px;height:26px;border-radius:50%;background:#DFEEE9;color:#194F52;font-weight:700;display:grid;place-items:center;font-size:15px}
.also{margin:16px 0 0;font-size:15px;color:#4b5f6c;line-height:1.55}
.sb-price{font:800 40px/1 Onest,Inter,sans-serif;color:#194F52}
.sb-price small{font:600 17px Inter,sans-serif;color:#4b5f6c}
.terms{background:#F9E4D5;border-radius:16px;padding:14px 16px;font-size:15px;line-height:1.5;margin:18px 0 14px}
.agree{display:flex;gap:11px;align-items:flex-start;font-size:14px;line-height:1.5;margin:0 0 16px}
.agree i{flex:none;width:20px;height:20px;border:2px solid #194F52;border-radius:6px;margin-top:1px;background:#fff}
.agree.on i{background:#194F52;color:#fff;display:grid;place-items:center;font-style:normal}
.agree.on i:after{content:"\2713";font-size:14px}
.s a{color:#194F52;text-decoration:underline}
.b{display:block;width:100%;box-sizing:border-box;text-align:center;border:0;border-radius:999px;padding:16px 22px;font:700 17px/1.2 Onest,Inter,sans-serif;background:#C4561F;color:#fff;cursor:pointer}
.b.dk{background:#194F52}
.b.ln{background:#fff;color:#193449;border:1.5px solid rgba(25,52,73,.3)}
.small{font-size:13.5px;color:#5b6b76;line-height:1.5}
.center{text-align:center}
.narrow{max-width:460px;margin:0 auto}
.inp{display:block;width:100%;box-sizing:border-box;padding:15px 16px;border:1px solid rgba(25,52,73,.35);border-radius:14px;font:500 17px Inter,sans-serif;background:#fff;margin:6px 0 16px;color:#193449}
.lbl{font:600 14px Inter,sans-serif}
.digits{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0 18px}
.digits span{height:58px;border:1.5px solid rgba(25,52,73,.3);border-radius:14px;display:grid;place-items:center;font:700 26px Onest,sans-serif;background:#fff}
.digits span.cur{border-color:#C4561F;box-shadow:0 0 0 3px rgba(196,86,31,.18)}
.note4{background:#DFEEE9;border-radius:16px;padding:13px 16px;font-size:15px;font-weight:600;margin:0 0 16px}
.badge{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 14px;font:700 14px Inter,sans-serif;background:#DFEEE9;color:#194F52}
.badge:before{content:"";width:9px;height:9px;border-radius:50%;background:#2e8b6b}
.badge.warn{background:#F9E4D5;color:#8a3d12}.badge.warn:before{background:#C4561F}
.sb-rows{margin:18px 0 0}
.sb-rows div{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid rgba(25,52,73,.12);font-size:16px}
.sb-rows span{color:#5b6b76}.sb-rows b{text-align:right}
.cardbox{border:1.5px solid rgba(25,52,73,.18);border-radius:18px;padding:18px;margin-top:20px}
.cardline{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.cardline svg{width:46px;height:32px;flex:none}
.cardline b{display:block}.cardline span{font-size:14px;color:#5b6b76}
.stack{display:grid;gap:12px}
.cab{max-width:560px;margin:0 auto}
.ov{position:fixed;inset:0;background:rgba(25,52,73,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:99}
.dlg{background:#FAF5EB;border-radius:22px;max-width:430px;width:100%;padding:26px}
.dlg h2{font:800 23px/1.25 Onest,sans-serif;margin:0 0 12px}
div.sf{border-top:1px solid rgba(25,52,73,.12);padding:20px;font-size:13px;line-height:1.7;color:#5b6b76;text-align:center}
div.sf a{color:#194F52}
@media (max-width:760px){.two{grid-template-columns:1fr;gap:22px}main.s{padding:24px 16px 36px}.box{padding:22px 18px}.digits{gap:6px}.digits span{height:50px;font-size:22px}}
.sb-rows{border:0;border-radius:0;display:block;background:none;box-shadow:none;overflow:visible}
.also{margin-top:16px}
div.sf a{display:inline}
@media (max-width:480px){.sh .in{padding:0 14px;gap:12px}.sh b{font-size:16px}.sh a{font-size:13.5px}}
.s p.also{margin-top:16px}
.cardline b,.sb-rows b{white-space:nowrap}
@media (max-width:480px){.cardline{gap:10px}.cardline svg{width:36px;height:25px}.cardline b{font-size:15px}}
.devnote{border:1.5px solid #194F52;border-radius:16px;padding:12px 16px;font-size:15px;line-height:1.5;margin:0 0 16px}
.devnote b{display:block}
/* v2: компактнее и строже */
body{font-size:15px}
.sh .in{max-width:940px;height:56px}.sh b{font-size:17px}.sh a{font-size:14px}
main.s{max-width:940px;padding:28px 20px 28px}
.s h1{font-size:28px;line-height:1.22;margin-bottom:8px;letter-spacing:-.01em}
.lead2{font-size:15.5px}
.two{grid-template-columns:1.12fr .88fr;gap:28px}
.box{border-radius:14px;box-shadow:0 6px 22px rgba(25,52,73,.08);border:1px solid rgba(25,52,73,.10);padding:22px}
.inc{background:#fff;border:1px solid rgba(25,52,73,.10);border-radius:14px;padding:6px 20px 14px;margin-top:18px}
.inc-h,.pay-h{font:700 12px Onest,Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#5b6b76}
.inc-h{padding:12px 0 4px}
.sb-list{margin:0;gap:0}
.sb-list li{font-size:15px;background:none;border-radius:0;padding:10px 0;gap:11px;border-bottom:1px solid rgba(25,52,73,.09)}
.sb-list li:last-child{border-bottom:0}
.sb-list li:before{width:20px;height:20px;font-size:12px}
.s p.also{font-size:13.5px;margin:6px 0 0;padding-top:12px;border-top:1px solid rgba(25,52,73,.18)}
.pay-h{margin-bottom:10px}
.sb-price{font-size:32px;padding-bottom:14px;border-bottom:1px solid rgba(25,52,73,.12)}.sb-price small{font-size:15px}
.devnote{border:0;border-radius:0;padding:12px 0 0;margin:0 0 14px !important;font-size:13.5px;color:#4b5f6c}
.devnote b{display:inline;color:#193449}
.consent{border:1.5px solid #194F52;background:#EEF5F3;border-radius:10px;padding:13px 14px}
.consent .agree{margin:0;font-size:14.5px;font-weight:600;line-height:1.45;color:#193449}
.agree i{width:18px;height:18px;border-radius:5px}
.fine{font-size:12.5px;line-height:1.5;color:#5b6b76}
.s p.fine{margin:9px 0 14px}
.b{border-radius:10px;padding:13px 18px;font-size:15.5px}
.have{margin-top:14px;padding-top:12px;border-top:1px solid rgba(25,52,73,.12);text-align:center;font-size:14px}
.narrow{max-width:400px}.cab{max-width:480px}
.s .narrow h1{font-size:23px !important}
.inp{padding:12px 14px;font-size:15.5px;border-radius:10px}
.digits span{height:48px;font-size:21px;border-radius:10px}
.sb-rows div{padding:10px 0;font-size:14.5px}
.badge{font-size:12.5px;padding:5px 12px}
.cardbox{border-radius:10px;padding:15px}
.note4,.dlg{border-radius:12px}.dlg{max-width:390px;padding:22px}.dlg h2{font-size:19px}
div.sf{font-size:12px;padding:14px 20px}
@media (max-width:760px){.two{grid-template-columns:1fr;gap:18px}main.s{padding:20px 14px 28px}.s h1{font-size:23px}.box{padding:18px 16px}.inc{padding:4px 16px 14px}}
/* v4: значки у пунктов */
.feat{list-style:none;margin:0;padding:0}
.feat li{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid rgba(25,52,73,.09);font-size:15px;line-height:1.4;color:#193449}
.feat li:last-child{border-bottom:0}
.feat img{width:44px;height:44px;object-fit:contain;flex:none}

.demo{background:#193449;color:#fff;text-align:center;font:600 13.5px/1.45 Inter,sans-serif;padding:9px 14px}
.key{background:#EEF5F3;border:1.5px dashed #194F52;border-radius:10px;padding:11px 14px;margin:0 0 14px;font-size:14px;line-height:1.55;color:#193449}
input.inp{outline-color:#C4561F}
.code-inp{text-align:center;letter-spacing:.45em;font:700 24px Onest,sans-serif !important}
.err{color:#B3261E;font-size:13.5px;min-height:20px;margin:0 0 8px}
.agree{cursor:pointer}.agree input{position:absolute;opacity:0;width:18px;height:18px;margin:0}
.agree input:checked + i{background:#194F52;display:grid;place-items:center}
.agree input:checked + i:after{content:"\2713";color:#fff;font-size:13px;font-style:normal}
.agree input:focus-visible + i{outline:2px solid #C4561F;outline-offset:2px}
.b:disabled{opacity:.45;cursor:default}
a.b{text-decoration:none !important;color:#fff !important}
.link{background:none;border:0;padding:0;font:inherit;color:#194F52;text-decoration:underline;cursor:pointer}

.news{display:flex;gap:11px;align-items:flex-start;font-size:14px;line-height:1.45;color:#193449;margin:0 0 14px;cursor:pointer}
.news input{width:19px;height:19px;flex:none;margin:1px 0 0;accent-color:#194F52}
.news{gap:8px;font-size:12.5px;color:#5b6b76;margin:0 0 10px}.news input{width:15px;height:15px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.plans{display:grid;gap:9px;margin:0 0 14px;border:0;padding:0}
.plans legend{font:700 17px Onest,sans-serif;color:#193449;padding:0;margin:0 0 10px}
.pl{display:grid;grid-template-columns:auto 1fr auto;column-gap:11px;align-items:center;border:1.5px solid rgba(25,52,73,.22);border-radius:12px;padding:12px 13px;cursor:pointer;color:#193449}
.pl input{width:18px;height:18px;margin:0;accent-color:#194F52}
.pl b{font:700 16px Onest,sans-serif}.pl em{font:800 18px Onest,sans-serif;font-style:normal;color:#194F52;white-space:nowrap}
.pl span{grid-column:2/4;font-size:13px;color:#5b6b76;line-height:1.45}.pl span i{font-style:normal;font-weight:600;color:#8a3d12}
.pl.on{border-color:#194F52;background:#EEF5F3;box-shadow:0 0 0 1px #194F52}
/* тариф, который советуем (3 месяца) */
.pl{position:relative}
.pl em s{font:600 13.5px Inter,sans-serif;color:#8a959d;margin-right:7px}
.pl.top{margin:9px 0 3px;padding:20px 13px 15px;border:2.5px solid transparent;border-radius:16px;background:linear-gradient(#FFF8F1,#FFF8F1) padding-box,linear-gradient(115deg,#C4561F 0%,#F2B27C 25%,#C4561F 50%,#2F7A72 75%,#C4561F 100%) border-box;background-size:100% 100%,260% 100%;box-shadow:0 8px 22px rgba(196,86,31,.18);animation:tflow 6s ease-in-out infinite alternate,tlift 3.6s ease-in-out infinite}
.pl.top.on{background:linear-gradient(#FDEFE3,#FDEFE3) padding-box,linear-gradient(115deg,#C4561F 0%,#F2B27C 25%,#C4561F 50%,#2F7A72 75%,#C4561F 100%) border-box;background-size:100% 100%,260% 100%}
.pl.top input{accent-color:#C4561F}
.pl.top>b,.pl.top>em,.pl.top>span,.pl.top>input{position:relative;z-index:1}
.pl.top b{font-size:18px}.pl.top em{font-size:25px;color:#B0480F}
.pl.top span{margin-top:4px;font-size:13.5px}
.pl.top span i{display:inline-block;background:#194F52;color:#fff;border-radius:999px;padding:2px 9px;font-size:12px;margin-left:3px}
.pl .tag{text-decoration:none;position:absolute;left:14px;top:-12px;background:linear-gradient(100deg,#C4561F,#E0763A);color:#fff;border-radius:999px;padding:4px 12px;font:700 12px/1.3 Onest,sans-serif;font-style:normal;box-shadow:0 4px 10px rgba(196,86,31,.35);z-index:1}
.pl .shine{text-decoration:none;position:absolute;inset:0;border-radius:13px;overflow:hidden;pointer-events:none;margin:0}
.pl .shine:before{content:"";position:absolute;top:-20%;bottom:-20%;width:34%;left:-60%;transform:skewX(-18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:tshine 4.8s ease-in-out infinite}
@keyframes tflow{from{background-position:0 0,0 0}to{background-position:0 0,100% 0}}
@keyframes tlift{0%,100%{transform:translateY(0);box-shadow:0 8px 22px rgba(196,86,31,.16)}50%{transform:translateY(-2px);box-shadow:0 13px 28px rgba(196,86,31,.28)}}
@keyframes tshine{0%,55%{left:-60%}85%,100%{left:130%}}
@media (prefers-reduced-motion:reduce){.pl.top,.pl .shine:before{animation:none}}
.salebar{background:linear-gradient(100deg,#C4561F,#E0763A);color:#fff;border-radius:12px;padding:11px 14px;margin:0 0 14px;font-size:13.5px;line-height:1.45}
.salebar b{display:block;font:800 16px Onest,sans-serif}
</style>

function say(e){var x=$("er");if(x)x.textContent=ERR[e]||"Что-то пошло не так. Повторите позже.";}
var st=null, more=false, changed=false, returned=/[?&]s=return/.test(location.search), polls=0, timer=0;   /* st = последний ответ сервера */
function remember(r){st=r;var v=get();if(r.token)v.token=r.token;v.email=r.email;v.news=r.news;v.full=r.full===true;v.fullUntil=v.full?Date.now()+90*864e5:0;v.access=r.access===true;v.paidUntil=r.paidUntil||0;v.canPay=r.canPay===true;v.checkedAt=Date.now();set(v);}
function day(t){return new Date(t).toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"}).replace(/\s*г\.$/,"")+" года";}
function row(a,b){return '<div><span>'+a+'</span><b>'+b+'</b></div>';}
var WAYS={sbp:'СБП',sberbank:'SberPay',tinkoff_bank:'T-Pay',yoo_money:'ЮMoney',mir_pay:'Mir Pay',alfabank:'Alfa Pay'};
function isCard(){return !st||!st.card||!st.card.type||st.card.type==='bank_card';}
function offName(){return !isCard()?"Отключить автоплатёж":"Отвязать карту";}
function cardBox(){return '<div class="cardbox"><div class="cardline">'+(isCard()?CARD:"")+'<div><b>'+(isCard()?"Банковская карта •••• "+esc(st.card.last4):"Оплата через "+(WAYS[st.card.type]||"ЮKassa"))+'</b><span>для автоматической оплаты</span></div></div><button class="b ln" id="unbind">'+offName()+'</button><p class="small" style="margin:10px 0 0">Это отменяет подписку: автосписания прекратятся, оплаченный доступ сохранится до конца срока.</p></div>';}
/* тарифы: цены берём из ответа сервера */
var TERMS={"1":{name:"1 месяц",every:"раз в месяц",months:1},"3":{name:"3 месяца",every:"раз в 3 месяца",months:3},"12":{name:"12 месяцев",every:"раз в 12 месяцев",months:12}}, ORDER=["1","3","12"], pick="3";
function prices(){return (st&&st.plans)||{"1":st&&st.price||399};}   /* сервер без тарифов: только месяц */
function sum(k){return prices()[k]+"&nbsp;₽";}
/* скидка от сервера действует только на новое оформление; sale=false: обычные цены (смена тарифа) */
function saleCut(k,sale){var s=sale&&st&&st.sale;return s&&s.prices[k]?s.prices[k]:0;}
/* первый месяц дешевле, только тем, кто ещё не платил (решает сервер) */
function introCut(k,sale){var i=sale&&k==="1"&&st&&st.intro,c=saleCut(k,sale);return i&&(!c||i<=c)?i:0;}
function cut(k,sale){return introCut(k,sale)||saleCut(k,sale);}
function payNow(k,sale){return cut(k,sale)||prices()[k];}
function payThen(k,sale){var c=saleCut(k,sale);return !introCut(k,sale)&&c&&st.sale.then==="same"?c:prices()[k];}
function rub(v){return v+"&nbsp;₽";}
function saleBar(){var s=st&&st.sale;if(!s)return '';return '<div class="salebar"><b>'+esc(s.title)+'</b>по '+day(s.until)+' включительно. '+(s.then==="same"?'Цена со скидкой сохранится при продлениях, пока подписка не отключена и тариф не изменён.':'Скидка на первую оплату, дальше обычная цена.')+'</div>';}
function plansBox(title,sel,mine,sale){var p=prices(),many=Object.keys(p).length>1;return '<fieldset class="plans"><legend>'+title+'</legend>'+ORDER.filter(function(k){return p[k];}).map(function(k){var n=TERMS[k].months,now=payNow(k,sale),save=p["1"]*n-now,per=now/n,top=many&&k==="3",note=[];
 if(n>1&&save>0)note.push((per%1?"примерно ":"")+Math.floor(per)+'&nbsp;₽ в месяц, <i>выгода '+save+'&nbsp;₽</i>');
 if(introCut(k,sale))note.push('первый месяц для новых подписчиков');
 if(cut(k,sale)&&payThen(k,sale)!==now)note.push('дальше '+rub(payThen(k,sale))+' '+TERMS[k].every);
 return '<label class="pl'+(top?" top":"")+(k===sel?" on":"")+'">'+(top?'<u class="tag">★ Советуем</u><u class="shine"></u>':'')+'<input type="radio" name="pl" value="'+k+'"'+(k===sel?" checked":"")+'><b>'+TERMS[k].name+(k===mine?" · сейчас":"")+'</b><em>'+(cut(k,sale)?'<s>'+rub(p[k])+'</s>':'')+rub(now)+'</em>'+(note.length?'<span>'+note.join('<br>')+'</span>':'')+'</label>';}).join("")+'</fieldset>';}
function agreeText(k,sale){var now=payNow(k,sale),then=payThen(k,sale);return "Согласен(на) на автоматическое списание"+(now===then?" "+rub(now)+" "+TERMS[k].every:": сейчас "+rub(now)+" за "+TERMS[k].name+", дальше "+rub(then)+" "+TERMS[k].every)+". Отключить можно в любой момент в личном кабинете.";}
function consent(k,sale){return '<div class="consent" id="cbox"><label class="agree"><input type="checkbox" id="ag"><i></i><span id="agt">'+agreeText(k,sale)+'</span></label></div>';}
function chosen(){return prices()[pick]?pick:"1";}
function offer(more){var k=chosen();return (more?'':'<p>Все интерактивные занятия и игры, без рекламы и ссылок на соцсети. До 3 устройств.</p><p class="small"><b>Для компьютера или планшета.</b> На телефоне картинки мелкие, и заниматься неудобно.</p>')+
 saleBar()+plansBox("Выберите срок",k,null,true)+consent(k,true)+
 '<p class="fine">Тариф продлевается сам на такой же срок. При возврате денег использованное время считается по цене без скидки: '+sum("1")+' в месяц. Если очередное списание не пройдёт, повторим через 1, 3 и 7 дней, затем списания прекратятся. Оформляя подписку, вы принимаете <a href="../../oferta/">публичную оферту</a>, в том числе <a href="../../oferta/#subscription">условия подписки</a>.</p><p class="err" style="min-height:0">'+(changed?ERR.price_changed:"")+'</p><button class="b" id="start" disabled>Перейти к оплате</button><p class="fine center" style="margin:10px 0 0">Откроется страница оплаты ЮKassa, там выбирается способ оплаты.</p>';}
function nextPlan(){return st.nextPlan||st.plan||"1";}
function nextSum(){return (st.nextPrice||st.price)+"&nbsp;₽";}
function planRows(){var k=st.plan||"1";return row("Тариф",TERMS[k].name+" · "+st.price+"&nbsp;₽");}
function planNote(){return st.nextPlan?'<p class="small" style="margin:12px 0 0">Со следующего списания тариф: <b>'+TERMS[st.nextPlan].name+', '+nextSum()+'</b> '+TERMS[st.nextPlan].every+'.</p>':'';}
function planBtn(){return st.plans?'<button class="b ln" id="chg" style="margin-top:16px">Сменить тариф</button>':'';}
/* что показать про подписку: только по ответу сервера */
function subBox(v){
 if(v.full)return '<span class="badge">Служебный доступ</span><p style="margin:14px 0 0">Все игры открыты без оплаты, поэтому тарифы здесь не показываются. Чтобы увидеть кабинет покупателя или оформить подписку, нажмите «Выйти» внизу и войдите с другой почтой.</p>';
 if(!st)return '<p style="margin:0">Проверяем подписку…</p>';
 var open=st.access, till=st.paidUntil?day(st.paidUntil):"", test=st.mode==="test"&&(st.canPay||st.card||st.access)?'<p class="small" style="margin:0 0 12px"><b>Тестовый режим: деньги не списываются.</b></p>':"", h;
 if(st.pending&&!open&&st.status!=="retry")h='<span class="badge warn">Проверяем оплату</span><p style="margin:14px 0">Ждём подтверждение от ЮKassa. Если вы не закончили оплату, откройте её страницу снова.</p>'+(st.pendingPlan&&st.plans?'<p class="small">Выбран тариф: <b>'+TERMS[st.pendingPlan].name+', '+rub(st.pendingAmount||prices()[st.pendingPlan])+'</b>. Чтобы выбрать другой, не оплачивайте эту страницу: она закроется сама, и тарифы появятся снова.</p>':'')+'<div class="stack"><button class="b" id="again">Проверить ещё раз</button><button class="b ln" id="resume">Открыть страницу оплаты</button></div>';
 else if(st.status==="retry"&&st.card)h='<span class="badge warn">Списание не прошло</span><p style="margin:14px 0">Не получилось списать '+nextSum()+'. '+(open?"Занятия открыты до "+till+".":"Доступ закрыт до успешной оплаты. За дни без доступа деньги не берём.")+'</p><div class="sb-rows">'+row("Следующая попытка",day(st.retryAt))+'</div><p class="small">Пробуем ещё через 1, 3 и 7 дней после первого отказа, потом списания прекращаются.</p>'+planNote()+planBtn()+cardBox();
 else if(st.status==="review")h='<span class="badge warn">Платёж проверяется</span><p style="margin:14px 0">Мы вручную проверяем последнее списание. Напишите в <a href="mailto:igrovoylogoped@gmail.com">поддержку</a>.</p>'+(st.card?cardBox():"");
 else if(open&&st.card)h='<span class="badge">Подписка активна</span><div class="sb-rows">'+planRows()+row("Следующее списание",till)+row("Сумма списания",nextSum())+row("Устройства",st.devices+" из "+st.maxDevices)+'</div>'+planNote()+planBtn()+cardBox();
 else if(open)h='<span class="badge warn">Автосписания отключены</span><p style="margin:14px 0"><b>Списаний больше не будет.</b> Занятия и игры открыты до '+till+'.</p><div class="sb-rows">'+row("Устройства",st.devices+" из "+st.maxDevices)+'</div>'+(st.canPay&&st.plans&&!st.pending?(more?'<p class="small" style="margin:18px 0 12px">Оплата спишется сейчас, а новый срок прибавится после '+till+'.</p>'+offer(true):'<button class="b ln" id="more" style="margin-top:16px">Подключить снова</button>'):'')+(st.pending?'<p class="small" style="margin:16px 0 10px">Новая оплата ещё не подтверждена.</p><div class="stack"><button class="b" id="again">Проверить ещё раз</button><button class="b ln" id="resume">Открыть страницу оплаты</button></div>':'');
 else{
  var why=st.status==="failed"?"Списания остановлены: оплата не прошла, автоплатёж отключён.":(returned&&!st.pending?"Оплата не прошла или была отменена.":(till?"Оплаченный срок закончился "+till+".":""));
  if(st.canPay)h=(why?'<p><b>'+why+'</b></p>':"")+offer();
  else h='<span class="badge warn">Подписка в разработке</span><p style="margin:14px 0 8px">'+(why?why+" ":"")+'Оформить её пока нельзя. Она откроет все интерактивные занятия и игры.</p><p class="small" style="margin:0">Сейчас бесплатно без ограничений: «Что звучит?», «Первые слова» и «Где мячик?». В остальных играх открыта часть заданий.</p>';
 }
 return test+h;
}
function draw(){if($("sb"))show("cab");}
/* ждём подтверждение оплаты: несколько проверок с паузой */
function watch(){clearTimeout(timer);if(!st||!st.pending||polls>=8)return;timer=setTimeout(function(){polls++;call("check").then(function(r){if(!r.ok)return;remember(r);draw();watch();});},4000);}
function load(){call(returned?"check":"me").then(function(r){if(r.ok){remember(r);draw();if(r.pending){call("check").then(function(c){if(c.ok){remember(c);draw();watch();}});}}else if(r.error==="auth"){set({email:get().email});st=null;show("email");}else say(r.error);});}
var views={
email:function(){return '<div class="narrow"><div class="box"><h1>Личный кабинет</h1><p>Введите почту: пришлём письмо с кодом из 6 цифр. Пароль придумывать не нужно. Если кабинета ещё нет, он создастся сам.</p><form id="f"><label class="lbl" for="em">Ваша почта</label><input class="inp" id="em" type="email" autocomplete="email" value="'+esc(get().email)+'"><input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">'+
 '<p class="err" id="er"></p><button class="b dk" id="go">Получить код</button></form><p class="fine" style="margin:12px 0 0">Регистрируясь, вы соглашаетесь получать на эту почту письма о подписке, о реферальной программе, скидках и новых играх, а также на обработку адреса по <a href="../../privacy/">политике конфиденциальности</a>. Отписаться можно в кабинете.</p></div></div>';},
code:function(){return '<div class="narrow"><div class="box"><h1>Введите код</h1><p>Отправили 6 цифр на <b>'+esc(get().email)+'</b>. Если письма нет, проверьте папку «Спам».</p><form id="f"><input class="inp code-inp" id="cd" inputmode="numeric" maxlength="6" autocomplete="one-time-code" aria-label="Код из 6 цифр"><p class="err" id="er"></p><button class="b dk" id="go">Войти</button></form><p class="small center" style="margin-top:14px">Код действует 10 минут. <a href="#" id="back">Изменить почту или прислать новый</a></p><p class="small center" style="margin:0">Вход на этом устройстве запомним на 90 дней.</p></div></div>';},
cab:function(){var v=get();return '<div class="cab"><h1>Мой кабинет</h1><p class="who2">'+esc(v.email)+'</p>'+
 '<div class="box" id="sb">'+subBox(v)+'</div>'+
 '<section class="go2"><h2>Занятие на сегодня</h2><p>Три игры, подобранные для вашего ребёнка.</p><div class="go2b"><a class="b" href="../segodnya/">Открыть занятие</a><a class="b ln" href="../">Все игры</a></div></section>'+
 '<p class="err" id="er"></p>'+
 '<div class="acc"><label class="news"><input type="checkbox" id="nw2"'+(v.news?" checked":"")+'><span>Получать письма о подписке, реферальной программе, скидках и новых играх</span></label><p class="small" id="nws"></p><p class="accl"><button class="link" id="out">Выйти</button><button class="link" id="del">Удалить мой кабинет</button></p></div>'+
 '<aside class="promo"><img src="/platform/img/alex_face.png" alt="Александра Карачинцева"><div><b>Нужна помощь специалиста?</b><span>Консультации Александры Карачинцевой.</span></div><a class="consult" href="/aleksandra-karachintseva/">Консультации и услуги</a><button type="button" class="x" aria-label="Скрыть">✕</button></aside></div>';},
planAsk:function(){var mine=st.plan||"1",k=chosen();return '<div class="narrow"><div class="box"><h1>Сменить тариф</h1><p>Сейчас ничего не спишется. Новый тариф начнёт действовать со следующего списания'+(st.status==="retry"?' (с ближайшей повторной попытки)':': '+day(st.paidUntil))+'.</p>'+plansBox("Выберите срок",k,mine,false)+consent(k,false)+'<p class="fine">При возврате денег использованное время считается по цене без скидки: '+sum("1")+' в месяц. <a href="../../oferta/#subscription">Условия подписки</a>.</p><p class="err" id="er"></p><div class="stack"><button class="b" id="psave" disabled>Сохранить тариф</button><button class="b ln" id="no">Назад</button></div></div></div>';},
unbindAsk:function(){return '<div class="narrow"><div class="box"><h1>'+offName()+'?</h1><p>Автоматические списания прекратятся.</p>'+(st&&st.access?'<p>Занятия и игры останутся открытыми до <b>'+day(st.paidUntil)+'</b>.</p>':'')+'<p class="err" id="er"></p><div class="stack"><button class="b" id="uyes">Да, '+offName().toLowerCase()+'</button><button class="b ln" id="no">Оставить как есть</button></div></div></div>';},
ask:function(){return '<div class="narrow"><div class="box"><h1>Удалить кабинет?</h1><p>Адрес <b>'+esc(get().email)+'</b> и настройки писем будут удалены из списка.</p><p class="err" id="er"></p><div class="stack"><button class="b" id="yes">Да, удалить</button><button class="b ln" id="no">Оставить</button></div></div></div>';}
};
function show(n){
 m.innerHTML=views[n]();window.scrollTo(0,0);
 on("f","submit",function(e){e.preventDefault();var b=$("go");
  if(n==="email"){if($("hp").value)return;b.disabled=true;var em=$("em").value.trim().toLowerCase();set({email:em});
   call("code").then(function(r){b.disabled=false;if(r.ok)show("code");else say(r.error);});}
  else{b.disabled=true;call("login",{code:$("cd").value.trim(),news:true}).then(function(r){b.disabled=false;if(!r.ok)return say(r.error);remember(r);show("cab");if(r.pending)load();});}});
 function toPay(b,data){b.disabled=true;data.consent=true;call("pay",data).then(function(r){if(r.ok&&r.url){location.href=r.url;return;}b.disabled=false;say(r.error);if(r.error==="price_changed"){changed=true;load();}else if(r.error==="pending"||r.error==="already"||r.error==="pending_plan")load();});}
 function arm(){var b=$("start")||$("psave");if(!b)return;var same=n==="planAsk"&&pick===nextPlan();if(n==="planAsk"){var mine=pick===(st.plan||"1");$("cbox").style.display=mine?"none":"";b.disabled=same||(!mine&&!$("ag").checked);}else b.disabled=!$("ag").checked;}
 on("ag","change",arm);
 /* согласие даётся на конкретную сумму: при смене тарифа отметка снимается */
 [].forEach.call(m.querySelectorAll('input[name="pl"]'),function(r){r.addEventListener("change",function(){pick=r.value;[].forEach.call(m.querySelectorAll(".pl"),function(l){l.classList.toggle("on",l.contains(r));});$("agt").innerHTML=agreeText(pick,n!=="planAsk");$("ag").checked=false;arm();});});
 if(n==="planAsk")arm();
 on("chg","click",function(){clearTimeout(timer);pick=nextPlan();show("planAsk");});
 on("psave","click",function(){var b=this;b.disabled=true;call("plan",{plan:pick,consent:pick===(st.plan||"1")||$("ag").checked}).then(function(r){if(r.ok){remember(r);pick="3";show("cab");}else{b.disabled=false;say(r.error);}});});
 on("more","click",function(){more=true;draw();});
 on("start","click",function(){var k=chosen();changed=false;toPay(this,{plan:k,amount:payNow(k,true),then:payThen(k,true)});});
 on("resume","click",function(){toPay(this,{plan:st.pendingPlan||"1",amount:st.pendingAmount||undefined});});
 on("again","click",function(){var b=this;b.disabled=true;polls=0;call("check").then(function(r){b.disabled=false;if(r.ok){remember(r);draw();watch();}else say(r.error);});});
 on("unbind","click",function(){clearTimeout(timer);show("unbindAsk");});
 on("uyes","click",function(){var b=this;b.disabled=true;call("unbind").then(function(r){if(r.ok){returned=false;remember(r);show("cab");}else{b.disabled=false;say(r.error);}});});
 on("back","click",function(e){e.preventDefault();show("email");});
 on("nw2","change",function(){var c=this;c.disabled=true;call("news",{on:c.checked}).then(function(r){c.disabled=false;if(r.ok){remember(r);$("nws").textContent="Сохранено.";}else{c.checked=!c.checked;say(r.error);}});});
 on("out","click",function(){clearTimeout(timer);call("logout").then(function(){st=null;set({});show("email");});});
 on("del","click",function(){show("ask");});
 on("no","click",function(){pick="3";show("cab");});
 on("yes","click",function(){var b=this;b.disabled=true;call("remove").then(function(r){if(r.ok){set({});show("email");}else{b.disabled=false;say(r.error);}});});
}
if(get().token){show("cab");load();}
else show("email");
})();
</script>
